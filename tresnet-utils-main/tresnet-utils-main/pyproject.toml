[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tresnet-utils"
version = "0.1.0"
description = "TResNet models with CMAL-Net implementation for fine-grained visual classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CMAL Contributors"}
]
keywords = ["deep-learning", "computer-vision", "image-classification", "tresnet", "cmal", "fine-grained-classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://gitlab.com/dat.tram/tresnet-utils"
Repository = "https://gitlab.com/dat.tram/tresnet-utils.git"
